[package]
name = "utaformatix"
version.workspace = true
edition.workspace = true

[features]
default = ["quickjs"]
boajs = ["dep:boa_engine"]
quickjs = ["dep:rquickjs"]

[dependencies]
anyhow = "1.0.102"
async-channel = "2.5.0"
boa_engine = { version = "0.21.1", features = ["annex-b"], optional = true }
duplicate = "2.0.1"
educe = { version = "0.6.0", features = ["Debug"] }
encoding_rs = "0.8.35"
once_cell = "1.21.4"
rquickjs = { version = "0.12.0", features = ["array-buffer", "futures", "macro"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "rt",
  "time",
  "sync",
] }
tracing = "0.1.44"
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
insta = "1.48.0"
rstest = "0.26.1"
tracing-test = "0.2.6"
