[package]
name = "ruby"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
async-ffi = "0.5.0"
bytes = "1.12.0"
duplicate = "2.0.1"
magnus = { version = "0.8.2", features = ["bytes", "rb-sys"] }
once_cell = "1.21.4"
rb-sys = "0.9.128"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_magnus = "0.11.0"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.23"
utaformatix.workspace = true
